name: build

# Binaries are built on native runners, one per target. Nothing is
# cross-compiled and nothing is built on a developer machine, so the artifact
# a user installs corresponds to a commit anyone can inspect.
on:
  push:
    branches: [main, master]      # whichever your default branch happens to be
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: eagle-image.win32-x64-msvc.node
            built: eagle_image.dll
          - os: macos-15-intel     # Intel runner; macos-13 was retired 2025-12-04
            target: x86_64-apple-darwin
            artifact: eagle-image.darwin-x64.node
            built: libeagle_image.dylib
          - os: macos-14           # Apple silicon runner
            target: aarch64-apple-darwin
            artifact: eagle-image.darwin-arm64.node
            built: libeagle_image.dylib

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # libwebp-sys asks bindgen to regenerate its bindings on this one target,
      # and bindgen needs libclang. Xcode already ships one, so point at that
      # rather than spending several minutes on `brew install llvm`.
      # If bindgen ever fails to find it, the brew line below is the fallback.
      - name: Point bindgen at Xcode's libclang (Intel macOS)
        if: matrix.os == 'macos-15-intel'
        run: |
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          # brew install llvm && echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name the artifact as a Node addon
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.built }}" "${{ matrix.artifact }}"

      # Proves the binary loads and produces a correct image on the platform it
      # was built for, rather than only that it compiled.
      - name: Smoke test
        shell: bash
        run: node scripts/smoke.js "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  bundle:
    name: bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: 'eagle-image.*.node'
          path: staging
          merge-multiple: true

      # The exact folder to drop into the plugin's node_modules.
      - name: Assemble the drop-in package
        run: |
          mkdir -p eagle-image
          cp index.js index.d.ts package.json eagle-image/
          cp staging/*.node eagle-image/
          ls -la eagle-image
          sha256sum eagle-image/*.node | tee eagle-image/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: eagle-image-package
          path: eagle-image
          if-no-files-found: error

  release:
    name: release
    needs: bundle
    # Only for tags. Artifacts from an ordinary push live on the run page and
    # expire; a release asset is permanent and has a stable URL.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eagle-image-package
          path: eagle-image

      - name: Zip the drop-in folder
        run: zip -r eagle-image-${{ github.ref_name }}.zip eagle-image

      - uses: softprops/action-gh-release@v3
        with:
          files: eagle-image-${{ github.ref_name }}.zip
          generate_release_notes: true

  wasm:
    name: wasm + benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # simd128 is what makes this worth measuring: fast_image_resize ships
      # hand-written wasm SIMD kernels for exactly the u8x3/u8x4 paths this
      # code uses, and without the flag they are compiled out to scalar.
      - name: Build wasm
        env:
          RUSTFLAGS: '-C target-feature=+simd128'
        run: wasm-pack build --release --target nodejs --out-dir pkg

      - name: Report wasm size
        run: ls -la pkg/*.wasm && du -h pkg/*.wasm

      # The native build, on the same runner, so the comparison is one CPU.
      - name: Build native for comparison
        run: |
          cargo build --release
          cp target/release/libeagle_image.so eagle-image.linux-x64-gnu.node

      - name: Native vs wasm
        run: node scripts/wasm-bench.js eagle-image.linux-x64-gnu.node pkg/eagle_image.js

      - uses: actions/upload-artifact@v7
        with:
          name: eagle-image-wasm
          path: pkg
          if-no-files-found: error
