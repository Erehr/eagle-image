[package]
name    = "eagle_image"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]

# Decoders only for the formats a comic archive can actually contain.
# Every one of these is pure Rust: zune-jpeg, png, gif, image-webp.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "bmp",
  "webp",
] }

# The same resampler the upstream addon uses, so Lanczos3 output is unchanged.
fast_image_resize = "6"

# Reduced-IDCT JPEG decoding: decode a 4000px page straight to 2000px rather
# than decoding in full and discarding most of it.
#
# default-features = false drops rayon. It is declared once rather than per
# target because Cargo unifies features across target sections of the same
# crate, so a wasm-only `default-features = false` does not reliably win.
jpeg-decoder = { version = "0.3", default-features = false }

# ── Native addon ──────────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi        = { version = "3", default-features = false, features = ["napi3"] }
napi-derive = { version = "3", default-features = false }

# ── WebAssembly ───────────────────────────────────────────────────────────
# No napi, and no libwebp: the wasm build contains no C and no executable code
# an antivirus heuristic scans.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# libwebp is C. On wasm32 `target_os` is "unknown", so a gate that only
# excludes macOS-x86_64 lets it through and the wasm build tries to compile a C
# library for a target with no C toolchain. The wasm exclusion has to be
# explicit.
[target.'cfg(all(not(target_arch = "wasm32"), not(all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel", "avx2", "sse41", "neon"] }

# The x86_64 macOS runner needs bindgen; every other target uses the vendored bindings.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel", "generate-bindings"] }

[build-dependencies]
napi-build = "2"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
strip         = "symbols"
# Note: `panic = "abort"` is deliberately NOT set. napi-rs converts a Rust panic
# into a thrown JS Error via catch_unwind, which only works while unwinding is
# enabled. With abort, a malformed page that panicked inside a decoder would
# take Eagle's whole renderer process down instead of failing that one render.
